<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        body {
            font-family : Arial, Helvetica, sans-serif;
            background-color : #f2f2f2;
            padding : 50px;
        }
        .container {
            width : 500px;
            margin : auto;
            background-color : white;
            padding : 30px;
            border : 1px solid #ccc;
            border-radius : 10px;
        }
        h2 {
            text-align: center;
        }
        label {
            display : inline-block;
            width : 150px;
            margin-bottom: 15px;
        }
        input {
            width : 280px;
            padding : 10px;
            margin-bottom: 15px;
            box-sizing : border-box;
        }
        button {
            padding : 10px 20px;
            margin : 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .tombol {
            text-align : center;
            margin : 10px 0;
        }
        #output {
            background-color: #f5f5f5;
        }       
    </style>
</head>
<body>
    <div class="container">

        <h2>Kalkulator Aritmatika</h2>

        <label for="bilangan1"> Input Bilangan 1</label>
        <input type="number" id="bilangan1" placeholder="Masukkan bilangan pertama">

        <br>

        <label for="bilangan2"> Input Bilangan 2</label>
        <input type="number" id="bilangan2" placeholder="Masukkan bilangan kedua">

        <div class="tombol">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">/</button>
        </div>

        <br>

        <label for="output">Output</label>
        <input type="text" id="output" readonly>
    </div>

    <script>
        function hitung(operator) {
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            let hasil;

            if (operator === "+") {
                hasil = bilangan1 + bilangan2;
            }
            else if (operator === "-") {
                hasil = bilangan1 - bilangan2;
            }
            else if (operator === "*") {
                 hasil = bilangan1 * bilangan2;
            }
            else if (operator === "/") {
                
                if(bilangan2 === 0) {
                     hasil = "Tidak bisa dibagi 0";
                } else {
                    hasil = bilangan1 / bilangan2;
                }

            }

            document.getElementById("output").value = hasil;
        }
    </script>
</body>
</html>
